<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0f"/>
      <stop offset="50%" stop-color="#0f1322"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo Pill -->
  <g transform="translate(100, 100)">
    <rect width="64" height="64" rx="16" fill="#161b2c" stroke="#6366f1" stroke-width="2"/>
    <text x="32" y="42" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#818cf8" text-anchor="middle">FK</text>
    <text x="84" y="42" font-family="system-ui, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">Palghar, Maharashtra, India</text>
  </g>

  <!-- Title & Tagline -->
  <text x="100" y="260" font-family="system-ui, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">Firoz Khan</text>
  <text x="100" y="325" font-family="system-ui, sans-serif" font-size="34" font-weight="700" fill="#818cf8">Full-Stack Developer &amp; Founder of FK Digital Media</text>
  
  <text x="100" y="390" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#cbd5e1">Fast, modern, SEO-ready websites &amp; web apps built end-to-end.</text>
  <text x="100" y="425" font-family="system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">React • Next.js • Astro • Node.js • Cloudflare • WordPress</text>

  <!-- Bottom Badges -->
  <g transform="translate(100, 480)">
    <rect width="170" height="42" rx="10" fill="#161b2c" stroke="#334155"/>
    <text x="85" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">30+ Delivered</text>
  </g>
  <g transform="translate(290, 480)">
    <rect width="210" height="42" rx="10" fill="#161b2c" stroke="#334155"/>
    <text x="105" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">90+ PageSpeed Target</text>
  </g>
  <g transform="translate(520, 480)">
    <rect width="250" height="42" rx="10" fill="#161b2c" stroke="#334155"/>
    <text x="125" y="27" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#10b981" text-anchor="middle">Global (India, USA, UK)</text>
  </g>
</svg>
